name: Desktop build

# 三平台桌面安装包出包矩阵。Windows 本机已真装验收；macOS/Linux 产物以 CI
# artifact 做基础可用性核对。发布走 release.yml（tag 触发）。
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'apps/cli/**'
      - 'apps/web/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/desktop.yml'

jobs:
  build:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            artifact: desktop-windows
            glob: |
              dist/*.exe
              dist/*.blockmap
              dist/latest.yml
          - os: macos-latest
            target: mac
            artifact: desktop-macos
            glob: |
              dist/*.dmg
              dist/*.blockmap
              dist/latest-mac.yml
          - os: ubuntu-latest
            target: linux
            artifact: desktop-linux
            glob: |
              dist/*.AppImage
              dist/*.deb
              dist/latest-linux.yml
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 组装 sidecar 资源：CLI bundle（tsc -b + tsdown）→ Web 静态导出
      # （next build）→ host 运行时闭包（npm --ignore-scripts，koffi /
      # @napi-rs/canvas 原生二进制由平台 prebuild 分发）。脚本对产物做
      # *.node 硬校验，缺平台二进制会当场失败。
      # 注意勿改回 extraResources 闭包方案：app-builder-lib 对顶层
      # node_modules 目录硬编码剪枝，闭包必须经 scripts/after-pack.cjs 落盘。
      - name: Assemble host sidecar
        run: node scripts/assemble-host.mjs --build
        working-directory: apps/desktop

      # GitHub runner 可直连 GitHub，无需本机的 ELECTRON_MIRROR；
      # @electron/get 已在 pnpm-workspace.yaml override 到 5.1.0，勿删。
      - name: electron-builder (--${{ matrix.target }})
        run: node node_modules/electron-builder/cli.js --${{ matrix.target }}
        working-directory: apps/desktop

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p packaged
          # glob 保持未引用展开（nullglob 兜底）：矩阵 glob 是模式而非字面路径，
          # 首跑曾因把模式放进双引号导致恒不匹配、artifact 收集为空。
          shopt -s nullglob
          for f in ${{ matrix.glob }}; do
            cp -v "apps/desktop/$f" packaged/
          done
          ls -la packaged/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: packaged/*
          if-no-files-found: error
