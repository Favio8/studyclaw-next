name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    name: Typecheck (full project graph)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4.4.0
        with:
          version: 11.7.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `tsc -b` 走 project references 全图，是契约变更的第一道防线。
      - run: node_modules/.bin/tsc -b tsconfig.json
      # 陷阱防护：tsc 误发射会在 src/ 下留下 .js 产物，历史上误提交过两次。
      - name: Guard against stray tsc emit in src/
        run: |
          stray=$(git status --porcelain --untracked-files=all | grep -E 'src/.*\.(js|d\.ts)$' || true)
          if [ -n "$stray" ]; then
            echo "::error::tsc emitted build artifacts into src/:"; echo "$stray"; exit 1
          fi

  test:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4.4.0
        with:
          version: 11.7.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 本机（Windows / 机械盘）全量并发会触发 vitest 默认 15s test / 10s hook
      # 超时，属环境噪声而非回归；CI 机器足够快，这里适度放宽以避免假红。
      - run: node_modules/.bin/vitest run --testTimeout=60000 --hookTimeout=60000

  test-web:
    name: Web tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4.4.0
        with:
          version: 11.7.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node_modules/.bin/vitest run
        working-directory: apps/web

  release-gate:
    name: Release pack + verify packed install + publint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4.4.0
        with:
          version: 11.7.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # FL-43：发布链路门禁——打包（CLI bundle + Web 静态导出）→ 合成发布清单
      # → npm pack → 真装一遍并运行。FL-20 这类"发布即坏"从此在这里现形。
      - run: pnpm run release:pack
      - run: pnpm run release:verify
      - run: pnpm run release:publint

  # 整机冒烟：真实 `electron .` 拉起 sidecar → 开窗加载 → 走应用自身退出路径
  # （before-quit → stopHost）→ sidecar 无残留。desktop.yml 只打包不跑应用，
  # 这条链路此前只有"本机手工跑过一次"的证据；进 CI 后优雅退出路径的退化
  # （如 before-quit 不再收 sidecar、窗口起不来、tap 注入丢失）会在 push 当天现形。
  # SMOKE_STRICT=1：优雅退出未生效本身即判失败（默认会因"强杀留孤儿是已知限制"
  # 而跳过 residue 断言，CI 上不允许走那条兜底路径）。
  desktop-smoke:
    name: Desktop smoke (windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4.4.0
        with:
          version: 11.7.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 组装 Host sidecar（CLI bundle + Web 静态导出 + 运行时闭包）——源码形态
      # 跑 `electron .` 需要 resources/host/bin.js 与 resources/web。
      - name: Assemble host sidecar
        run: node scripts/assemble-host.mjs --build
        working-directory: apps/desktop
      - name: Smoke the app end to end
        run: node scripts/smoke-desktop.mjs
        working-directory: apps/desktop
        env:
          SMOKE_STRICT: '1'
