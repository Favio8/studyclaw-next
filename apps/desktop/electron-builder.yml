appId: ai.studyclaw.desktop
productName: StudyClaw
copyright: Copyright © 2026 StudyClaw authors

directories:
  output: dist
  buildResources: build

# Host 依赖闭包（node_modules 顶层目录被 createFilter 硬编码剪枝，无法经
# extraResources 落盘）——由 afterPack 钩子直接拷入，见 scripts/after-pack.cjs。
afterPack: scripts/after-pack.cjs

# 主程序只打包壳自身代码；host/web 资源走 extraResources（原样落盘，
# 不进 asar —— 原生 .node 与运行时读取都更稳，R4）。
files:
  - src/**/*
  - package.json
extraResources:
  - from: resources/host
    to: host
    filter: ["**/*"]
  - from: resources/web
    to: web
    filter: ["**/*"]
asar: true

win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-${version}-setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false

mac:
  target:
    # zip 是 generic provider 自动更新的载荷（latest-mac.yml 引用它），dmg 是人
    # 下载的安装镜像——两者都要出。
    - target: zip
      arch: [arm64, x64]
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.education
  artifactName: ${productName}-${version}-${arch}.${ext}
  # 签名/公证见 plan 4.4；无证书时保持 identity: null 可出未签名包
  identity: null
  hardenedRuntime: true
dmg:
  title: ${productName}-${version}

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Education
  # scope 包名（@studyclaw/desktop）默认派生出含 @ 的 executableName，
  # AppImage 打包会因路径安全检查拒绝——显式指定合法名。
  executableName: studyclaw

# 自动更新元数据（latest*.yml 的 url 指向 GitHub Release 的 latest 下载地址；
# Release 由 .github/workflows/release.yml 在 tag 推送时产出）。
publish:
  provider: generic
  url: https://github.com/Favio8/studyclaw-next/releases/latest/download/
