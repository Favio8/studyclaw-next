name: 💡 功能建议
description: 提出新功能或改进建议
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        提建议前不妨先想想：这个建议是否契合 StudyClaw「**本地优先、文件即状态、无遥测**」的定位？
        建议先在 [Discussions](../../discussions) 发帖讨论大致想法，成熟后再开 Issue 便于跟踪。

  - type: textarea
    id: problem
    attributes:
      label: 场景与问题
      description: 你在什么学习场景下遇到了什么问题或低效环节？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你希望它是什么样的？越具体越好（交互、命令、文件格式等）
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 现在的替代做法
      description: 当前你是怎么绕过这个问题的？
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 相关截图、同类产品的参考等（可选）
    validations:
      required: false
